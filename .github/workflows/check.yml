name: check

on:
  push:
  pull_request:

jobs:
  game-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: game.js and pokemon.js copies match
        run: scripts/sync-game.sh --check
      - name: game rules
        run: bun test
