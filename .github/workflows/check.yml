name: check

on:
  push:
  pull_request:

jobs:
  game-copies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anthonymq/pokedex-agents-server
          path: pokedex-agents-server
      - name: game.js, pokemon.js and server.js copies match
        run: POKEDEX_SERVER_DIR=pokedex-agents-server scripts/sync-game.sh --check
